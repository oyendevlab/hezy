# Kemas kini kebergantungan automatik (v0.8.1): satu PR berkumpulan seminggu supaya tampalan
# keselamatan (cth. Next.js 16.4.1) tidak terlepas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    # Versi major (cth. TypeScript 7, ESLint 10, @types/node melebihi enjin Node 22) dinaik
    # taraf secara manual dengan semakan sendiri.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      patch-dan-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
