name: CI

on:
  pull_request:
  push:
    branches: [main]

# Token GITHUB_TOKEN baca sahaja (v0.8.1).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semakan:
    name: Lint, typecheck, ujian unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Build mesti lulus walaupun APIMS/Open-Meteo/MetMalaysia tergantung (v0.8.13; CI PR #142
      # pernah gagal memprarender /negeri/johor kerana APIMS tamat masa).
      - name: Build tanpa sumber luar (fetch tergantung hingga tamat masa)
        run: npm run build:tanpa-sumber
        env:
          HEZY_SEKAT_MOD: tergantung

  e2e:
    name: Ujian E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
