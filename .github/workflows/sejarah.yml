name: Kumpul sejarah IPU

on:
  schedule:
    # Setiap 3 jam pada minit ke-40: simpan IPU sejam APIMS semalam dan hari ini (heatmap).
    - cron: "40 */3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Bilangan hari ke belakang termasuk hari ini (1–8; APIMS menyimpan ~7 hari)"
        default: "2"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Panggil /api/history/collect satu hari demi satu hari
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DAYS: ${{ github.event.inputs.days || '2' }}
        run: |
          FAILED=0
          # Hari paling lama dahulu supaya indeks dikemas kini mengikut urutan.
          for BACK in $(seq $((DAYS - 1)) -1 0); do
            if RESULT=$(curl -fsS --max-time 120 \
                -H "Authorization: Bearer $CRON_SECRET" \
                "https://hezy.vercel.app/api/history/collect?back=$BACK"); then
              echo "$RESULT"
              echo "- \`$RESULT\`" >> "$GITHUB_STEP_SUMMARY"
              # Negeri yang gagal bagi hari yang berjaya hanya dilaporkan.
              N=$(echo "$RESULT" | jq '.failedStates | length')
              [ "$N" -gt 0 ] && echo "::warning::$N negeri gagal ($(echo "$RESULT" | jq -r .date))"
            else
              echo "::error::Hari back=$BACK gagal"
              FAILED=$((FAILED + 1))
            fi
            sleep 5
          done
          [ "$FAILED" -eq 0 ]
