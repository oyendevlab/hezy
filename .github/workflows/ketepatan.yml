name: Ketepatan ramalan

on:
  schedule:
    # Sandaran kepada Vercel Cron (v0.8.4; vercel.json, 20:xx waktu Malaysia). GitHub sering
    # lewat 4–7 jam, jadi larian berjadual dilangkau jika indeks sudah dikemas kini.
    - cron: "50 12 * * *"
  workflow_dispatch:

# Hanya memanggil hezy.my dengan CRON_SECRET; tidak perlu akses repo (v0.8.1).
permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Panggil /api/accuracy/run
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="https://hezy.my/api/accuracy/run"
          # Larian manual sentiasa dijalankan; larian berjadual hanya jika Vercel Cron terlepas.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then URL="$URL?ifStale=20"; fi
          RESULT=$(curl -fsS --max-time 280 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL")
          echo "$RESULT" | jq .
          echo "### Ketepatan: \`$(echo "$RESULT" | jq -c .)\`" >> "$GITHUB_STEP_SUMMARY"
