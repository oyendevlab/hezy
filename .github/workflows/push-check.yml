name: Semak amaran IPU

on:
  # Semakan berjadual kini oleh Vercel Cron setiap 15 minit (v0.8.14, pelan Pro): jadual GitHub
  # hanya ~7/96 larian sehari berjalan (17 Okt 2026). Aliran kerja ini kekal untuk larian manual
  # (`force=1` memproses walaupun data belum berubah).
  workflow_dispatch:

concurrency:
  group: push-check
  cancel-in-progress: false

# Hanya memanggil hezy.my dengan CRON_SECRET; tidak perlu akses repo (v0.8.1).
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panggil /api/push/check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          RESULT=$(curl -fsS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://hezy.my/api/push/check?force=1")
          echo "$RESULT"
          echo "### Semakan amaran: \`$RESULT\`" >> "$GITHUB_STEP_SUMMARY"
          # Gagalkan job jika ada notifikasi yang gagal dihantar (bukan langganan tamat).
          FAILED=$(echo "$RESULT" | jq '.failed')
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED notifikasi gagal dihantar"
            exit 1
          fi
