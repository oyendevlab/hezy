name: Semak amaran IPU

on:
  schedule:
    # Empat kali sejam pada minit ganjil (v0.8.4): GitHub menggugurkan banyak larian berjadual,
    # terutama pada awal jam (dahulu "12 * * * *" hanya ~21% berjalan). Logik amaran berasaskan
    # keadaan, jadi larian tambahan tidak menghantar notifikasi berganda. Vercel Cron turut
    # memanggil pada tetingkap ringkasan pagi, status sekolah dan ramalan esok.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: push-check
  cancel-in-progress: false

# Hanya memanggil hezy.my dengan CRON_SECRET; tidak perlu akses repo (v0.8.1).
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panggil /api/push/check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          RESULT=$(curl -fsS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://hezy.my/api/push/check)
          echo "$RESULT"
          echo "### Semakan amaran: \`$RESULT\`" >> "$GITHUB_STEP_SUMMARY"
          # Gagalkan job jika ada notifikasi yang gagal dihantar (bukan langganan tamat).
          FAILED=$(echo "$RESULT" | jq '.failed')
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED notifikasi gagal dihantar"
            exit 1
          fi
